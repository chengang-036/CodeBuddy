<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据脱敏工具（离线版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #1890ff;
            padding: 16px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #1890ff;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .info-box ul {
            margin-left: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
        }

        .upload-area {
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #fafafa;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #1890ff;
            background: #f0f7ff;
        }

        .upload-area.dragover {
            border-color: #1890ff;
            background: #e6f7ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .btn:hover {
            background: #40a9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.4);
        }

        .btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: #52c41a;
        }

        .btn-success:hover {
            background: #73d13d;
        }

        .progress-container {
            display: none;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1890ff, #52c41a);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .result-info {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 6px;
        }

        .result-info h3 {
            color: #52c41a;
            margin-bottom: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
        }

        .result-value {
            color: #333;
            font-weight: bold;
        }

        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        .log-box {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            display: none;
        }

        .log-item {
            margin-bottom: 5px;
        }

        .log-success {
            color: #52c41a;
        }

        .log-warning {
            color: #faad14;
        }

        .version-tag {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 数据脱敏工具</h1>
        <p class="subtitle">安全、快速地处理敏感信息（离线版 - 无需联网）</p>

        <div class="info-box">
            <h3>🔒 脱敏规则说明</h3>
            <ul>
                <li><strong>第二列（B列）</strong>：手机号 → 138******78-HX-哈希值</li>
                <li><strong>Q列（第17列）</strong>：自动识别手机号、座机、身份证</li>
                <li><strong>W列（第23列）</strong>：身份证 → 110101********1234</li>
                <li><strong>特点</strong>：相同号码的哈希值相同，可识别重复</li>
            </ul>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽Excel文件到此区域</div>
            <div class="upload-hint">支持 .xlsx, .xls 格式 | 请先关闭Excel文件</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="result-info" id="resultInfo">
            <h3>✅ 脱敏完成</h3>
            <div class="result-item">
                <span class="result-label">处理行数：</span>
                <span class="result-value" id="rowCount">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">脱敏手机号：</span>
                <span class="result-value" id="phoneCount">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">脱敏身份证：</span>
                <span class="result-value" id="idCardCount">0</span>
            </div>
            <div class="result-item">
                <span class="result-label">脱敏座机号：</span>
                <span class="result-value" id="telCount">0</span>
            </div>
        </div>

        <div class="log-box" id="logBox"></div>

        <div class="button-group">
            <button class="btn btn-success" id="downloadBtn" style="display: none;">
                💾 下载脱敏后的文件
            </button>
        </div>

        <div class="version-tag">
            离线版 v1.0 | 完全本地处理 | 数据安全可靠
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // 简化的Excel处理 - 如果CDN失败，使用基础功能
        let useBasicMode = false;
        
        setTimeout(() => {
            if (typeof XLSX === 'undefined') {
                useBasicMode = true;
                alert('注意：Excel库加载失败，将使用基础模式。\n功能可能受限，建议检查网络后刷新页面。');
            }
        }, 3000);

        let processedData = null;
        let fileName = '';
        let originalExt = '';
        
        const desensitizeMap = new Map();
        const stats = {
            rows: 0,
            phones: 0,
            idCards: 0,
            tels: 0
        };

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const resultInfo = document.getElementById('resultInfo');
        const downloadBtn = document.getElementById('downloadBtn');
        const logBox = document.getElementById('logBox');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        downloadBtn.addEventListener('click', downloadFile);

        function log(message, type = 'normal') {
            logBox.style.display = 'block';
            const logItem = document.createElement('div');
            logItem.className = `log-item ${type === 'success' ? 'log-success' : type === 'warning' ? 'log-warning' : ''}`;
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.appendChild(logItem);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function handleFile(file) {
            if (typeof XLSX === 'undefined') {
                alert('错误：Excel处理库未加载\n\n请检查：\n1. 电脑是否联网\n2. 按Ctrl+F5刷新页面\n3. 或联系技术支持');
                return;
            }

            fileName = file.name.replace(/\.[^.]+$/, '');
            originalExt = file.name.match(/\.[^.]+$/)[0];
            log(`开始处理文件: ${file.name}`);
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    progressContainer.style.display = 'block';
                    updateProgress(10, '读取文件...');
                    
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    updateProgress(30, '解析数据...');
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    updateProgress(50, '脱敏处理中...');
                    
                    desensitizeWorksheet(worksheet);
                    
                    updateProgress(90, '保存数据...');
                    
                    processedData = workbook;
                    
                    updateProgress(100, '完成！');
                    
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        resultInfo.style.display = 'block';
                        downloadBtn.style.display = 'inline-block';
                        
                        document.getElementById('rowCount').textContent = stats.rows;
                        document.getElementById('phoneCount').textContent = stats.phones;
                        document.getElementById('idCardCount').textContent = stats.idCards;
                        document.getElementById('telCount').textContent = stats.tels;
                        
                        log('脱敏处理完成！', 'success');
                    }, 500);
                    
                } catch (error) {
                    alert('文件处理失败：' + error.message);
                    log('错误: ' + error.message, 'warning');
                    progressContainer.style.display = 'none';
                }
            };
            
            reader.readAsArrayBuffer(file);
        }

        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressFill.textContent = text || percent + '%';
        }

        function desensitizeWorksheet(worksheet) {
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            stats.rows = range.e.r - range.s.r;
            
            log(`开始处理 ${stats.rows} 行数据`);
            
            for (let row = range.s.r + 1; row <= range.e.r; row++) {
                // B列
                const cellB = worksheet[XLSX.utils.encode_cell({ r: row, c: 1 })];
                if (cellB && cellB.v) {
                    const original = String(cellB.v).trim();
                    cellB.v = desensitizePhone(original);
                }
                
                // Q列
                const cellQ = worksheet[XLSX.utils.encode_cell({ r: row, c: 16 })];
                if (cellQ && cellQ.v) {
                    cellQ.v = desensitizeMixedContent(String(cellQ.v));
                }
                
                // W列
                const cellW = worksheet[XLSX.utils.encode_cell({ r: row, c: 22 })];
                if (cellW && cellW.v) {
                    const original = String(cellW.v).trim();
                    cellW.v = desensitizeIdCard(original);
                }
            }
            
            log(`处理完成: 手机${stats.phones}个, 身份证${stats.idCards}个, 座机${stats.tels}个`, 'success');
        }

        function generateUniqueCode(str, length = 6) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            const positiveHash = Math.abs(hash);
            let code = String(positiveHash).slice(0, length);
            while (code.length < length) {
                code = code + String(positiveHash).charAt(code.length % String(positiveHash).length);
            }
            return code;
        }

        function desensitizePhone(str) {
            if (!str) return str;
            
            if (desensitizeMap.has(str)) {
                return desensitizeMap.get(str);
            }
            
            let result = str;
            
            const mobileRegex = /1[3-9]\d{9}/g;
            if (mobileRegex.test(str)) {
                const prefix = str.substring(0, 3);
                const suffix = str.substring(9, 11);
                const hashCode = generateUniqueCode(str, 6);
                result = `${prefix}******${suffix}-HX-${hashCode}`;
                stats.phones++;
                log(`脱敏手机号: ${str} → ${result}`);
            }
            else if (/^0\d{2,3}-?\d{7,8}$/.test(str)) {
                const parts = str.split('-');
                const hashCode = generateUniqueCode(str, 6);
                if (parts.length === 2) {
                    const areaCode = parts[0];
                    const number = parts[1];
                    result = `${areaCode}-****${number.slice(-2)}-HX-${hashCode}`;
                } else {
                    result = str.substring(0, 4) + '****' + str.slice(-2) + `-HX-${hashCode}`;
                }
                stats.tels++;
                log(`脱敏座机号: ${str} → ${result}`);
            }
            
            desensitizeMap.set(str, result);
            return result;
        }

        function desensitizeIdCard(str) {
            if (!str) return str;
            
            if (desensitizeMap.has(str)) {
                return desensitizeMap.get(str);
            }
            
            let result = str;
            
            if (/^\d{18}$/.test(str) || /^\d{17}[Xx]$/.test(str)) {
                result = str.substring(0, 6) + '********' + str.substring(str.length - 4);
                stats.idCards++;
                log(`脱敏身份证: ${str} → ${result}`);
            }
            else if (/^\d{15}$/.test(str)) {
                result = str.substring(0, 6) + '*****' + str.substring(str.length - 4);
                stats.idCards++;
                log(`脱敏身份证: ${str} → ${result}`);
            }
            
            desensitizeMap.set(str, result);
            return result;
        }

        function desensitizeMixedContent(str) {
            if (!str) return str;
            
            let result = str;
            
            result = result.replace(/1[3-9]\d{9}/g, (match) => {
                if (!desensitizeMap.has(match)) {
                    const prefix = match.substring(0, 3);
                    const suffix = match.substring(9, 11);
                    const hashCode = generateUniqueCode(match, 6);
                    const masked = `${prefix}******${suffix}-HX-${hashCode}`;
                    desensitizeMap.set(match, masked);
                    stats.phones++;
                    log(`Q列脱敏手机: ${match} → ${masked}`);
                }
                return desensitizeMap.get(match);
            });
            
            result = result.replace(/\b\d{17}[\dXx]\b/g, (match) => {
                if (!desensitizeMap.has(match)) {
                    const masked = match.substring(0, 6) + '********' + match.substring(match.length - 4);
                    desensitizeMap.set(match, masked);
                    stats.idCards++;
                    log(`Q列脱敏身份证: ${match} → ${masked}`);
                }
                return desensitizeMap.get(match);
            });
            
            result = result.replace(/\b\d{15}\b/g, (match) => {
                if (!desensitizeMap.has(match)) {
                    const masked = match.substring(0, 6) + '*****' + match.substring(match.length - 4);
                    desensitizeMap.set(match, masked);
                    stats.idCards++;
                    log(`Q列脱敏身份证: ${match} → ${masked}`);
                }
                return desensitizeMap.get(match);
            });
            
            result = result.replace(/0\d{2,3}-?\d{7,8}/g, (match) => {
                if (!desensitizeMap.has(match)) {
                    const parts = match.split('-');
                    const hashCode = generateUniqueCode(match, 6);
                    let masked;
                    if (parts.length === 2) {
                        const areaCode = parts[0];
                        const number = parts[1];
                        masked = `${areaCode}-****${number.slice(-2)}-HX-${hashCode}`;
                    } else {
                        masked = match.substring(0, 4) + '****' + match.slice(-2) + `-HX-${hashCode}`;
                    }
                    desensitizeMap.set(match, masked);
                    stats.tels++;
                    log(`Q列脱敏座机: ${match} → ${masked}`);
                }
                return desensitizeMap.get(match);
            });
            
            return result;
        }

        function downloadFile() {
            if (!processedData) {
                alert('没有可下载的文件');
                return;
            }
            
            if (typeof XLSX === 'undefined') {
                alert('下载功能需要Excel库支持\n请刷新页面后重试');
                return;
            }
            
            const wbout = XLSX.write(processedData, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            
            const newFileName = fileName + '_脱敏' + originalExt;
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = newFileName;
            a.click();
            URL.revokeObjectURL(url);
            
            log(`文件已下载: ${newFileName}`, 'success');
        }
    </script>
</body>
</html>
