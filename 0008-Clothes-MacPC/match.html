<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搭配衣服 - Clothes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
        }

        .btn-back {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: white;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .match-sections {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 3px solid #e0e0e0;
        }

        .match-section.has-selection {
            border-color: #667eea;
        }

        .section-title {
            font-size: 1.2rem;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .search-area {
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .tag-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tag-filter-btn {
            padding: 6px 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag-filter-btn:hover,
        .tag-filter-btn.active {
            background: #e7f0ff;
            border-color: #667eea;
            color: #667eea;
        }

        .selected-display {
            position: relative;
            background: white;
            border-radius: 10px;
            padding: 10px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .selected-image {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
        }

        .selected-desc {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .empty-selection {
            color: #999;
            text-align: center;
        }

        .btn-clear-selection {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .clothes-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-item {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .result-item:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .result-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .action-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .outfit-name-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .outfit-name-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background: #5a6268;
        }

        .success-message {
            display: none;
            padding: 15px;
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 8px;
            color: #155724;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-message.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1200px) {
            .match-sections {
                grid-template-columns: 1fr;
            }

            .clothes-results {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ 搭配衣服</h1>
            <a href="index.html" class="btn-back">← 返回主页</a>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage">
                ✓ 搭配方案已成功保存！
            </div>

            <div class="match-sections">
                <!-- 上装区域 -->
                <div class="match-section" id="section-top">
                    <div class="section-title">👕 上装</div>
                    <div class="search-area">
                        <input type="text" class="search-input" placeholder="搜索上装..." 
                               oninput="searchInSection('top', this.value)">
                        <div class="tag-filters" id="tags-top"></div>
                    </div>
                    <div class="selected-display" id="selected-top">
                        <div class="empty-selection">点击下方选择上装</div>
                    </div>
                    <div class="clothes-results" id="results-top"></div>
                </div>

                <!-- 下装区域 -->
                <div class="match-section" id="section-middle">
                    <div class="section-title">👖 下装</div>
                    <div class="search-area">
                        <input type="text" class="search-input" placeholder="搜索下装..." 
                               oninput="searchInSection('middle', this.value)">
                        <div class="tag-filters" id="tags-middle"></div>
                    </div>
                    <div class="selected-display" id="selected-middle">
                        <div class="empty-selection">点击下方选择下装</div>
                    </div>
                    <div class="clothes-results" id="results-middle"></div>
                </div>

                <!-- 鞋子区域 -->
                <div class="match-section" id="section-bottom">
                    <div class="section-title">👞 鞋子/配饰</div>
                    <div class="search-area">
                        <input type="text" class="search-input" placeholder="搜索鞋子..." 
                               oninput="searchInSection('bottom', this.value)">
                        <div class="tag-filters" id="tags-bottom"></div>
                    </div>
                    <div class="selected-display" id="selected-bottom">
                        <div class="empty-selection">点击下方选择鞋子</div>
                    </div>
                    <div class="clothes-results" id="results-bottom"></div>
                </div>
            </div>

            <div class="action-bar">
                <input type="text" class="outfit-name-input" id="outfitName" 
                       placeholder="给这套搭配起个名字...（例如：我最喜欢的衣服组合）">
                <button class="btn btn-save" onclick="saveOutfit()">💾 保存搭配</button>
                <button class="btn btn-reset" onclick="resetAll()">🔄 重置</button>
            </div>
        </div>
    </div>

    <script>
        let allClothes = [];
        let allTags = new Set();
        let selections = {
            top: null,
            middle: null,
            bottom: null
        };
        let sectionFilters = {
            top: { keyword: '', tags: new Set() },
            middle: { keyword: '', tags: new Set() },
            bottom: { keyword: '', tags: new Set() }
        };

        // 如果是编辑模式，从URL获取搭配ID
        const urlParams = new URLSearchParams(window.location.search);
        const editOutfitId = urlParams.get('edit');

        // 加载衣服数据
        function loadClothes() {
            try {
                allClothes = JSON.parse(localStorage.getItem('clothes') || '[]').map(function(cloth) {
                    // 兼容不同的图片字段名：imageData(本地) 或 imageUrl(云端)
                    const imageSource = cloth.imageData || cloth.imageUrl || cloth.image || '';
                    return {
                        id: cloth.id || cloth._id,
                        image: imageSource,
                        description: cloth.description,
                        tags: cloth.tags || []
                    };
                });
                
                console.log('加载了', allClothes.length, '件衣服');
            } catch (error) {
                console.error('加载衣服数据失败:', error);
                alert('加载衣服数据失败: ' + error.message);
                allClothes = [];
            }
            
            // 收集所有标签
            allTags.clear();
            allClothes.forEach(function(cloth) {
                if (cloth.tags) {
                    cloth.tags.forEach(function(tag) {
                        allTags.add(tag);
                    });
                }
            });

            // 初始化三个区域的标签过滤器
            ['top', 'middle', 'bottom'].forEach(function(section) {
                updateTagFilters(section);
                displayClothes(section);
            });

            // 如果是编辑模式，加载原有搭配
            if (editOutfitId) {
                loadOutfitForEdit(editOutfitId);
            }
        }

        // 加载搭配用于编辑
        function loadOutfitForEdit(id) {
            try {
                const outfits = JSON.parse(localStorage.getItem('outfits') || '[]');
                const outfit = outfits.find(o => o.id === id);
                
                if (outfit) {
                    document.getElementById('outfitName').value = outfit.name;
                    
                    if (outfit.top) selectCloth('top', outfit.top);
                    if (outfit.middle) selectCloth('middle', outfit.middle);
                    if (outfit.bottom) selectCloth('bottom', outfit.bottom);
                }
            } catch (error) {
                console.error('加载搭配失败:', error);
            }
        }

        // 更新标签过滤器
        function updateTagFilters(section) {
            const container = document.getElementById('tags-' + section);
            if (allTags.size === 0) return;

            container.innerHTML = Array.from(allTags).slice(0, 8).map(function(tag) {
                return '<button class="tag-filter-btn" onclick="toggleTagFilter(\'' + section + '\', \'' + tag + '\', this)">' +
                    tag + '</button>';
            }).join('');
        }

        // 切换标签过滤
        function toggleTagFilter(section, tag, btn) {
            const filters = sectionFilters[section];
            
            if (filters.tags.has(tag)) {
                filters.tags.delete(tag);
                btn.classList.remove('active');
            } else {
                filters.tags.add(tag);
                btn.classList.add('active');
            }
            
            displayClothes(section);
        }

        // 搜索
        function searchInSection(section, keyword) {
            sectionFilters[section].keyword = keyword.toLowerCase();
            displayClothes(section);
        }

        // 显示衣服
        function displayClothes(section) {
            const filters = sectionFilters[section];
            
            let filtered = allClothes.filter(cloth => {
                const keywordMatch = !filters.keyword || 
                    cloth.description.toLowerCase().includes(filters.keyword);
                
                const tagMatch = filters.tags.size === 0 || 
                    Array.from(filters.tags).every(tag => cloth.tags.includes(tag));
                
                return keywordMatch && tagMatch;
            });

            const resultsDiv = document.getElementById(`results-${section}`);
            
            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999; padding: 20px;">暂无结果</div>';
                return;
            }

            resultsDiv.innerHTML = filtered.map(function(cloth) {
                return '<div class="result-item" onclick="selectClothByIndex(' + allClothes.indexOf(cloth) + ', \'' + section + '\')">' +
                    '<img src="' + cloth.image + '" alt="' + cloth.description + '">' +
                    '</div>';
            }).join('');
        }

        // 通过索引选择衣服（避免ID问题）
        function selectClothByIndex(index, section) {
            const cloth = allClothes[index];
            if (!cloth) return;

            selections[section] = cloth;
            
            const displayDiv = document.getElementById(`selected-${section}`);
            displayDiv.innerHTML = 
                '<button class="btn-clear-selection" onclick="clearSelection(\'' + section + '\')">×</button>' +
                '<img src="' + cloth.image + '" class="selected-image" alt="' + cloth.description + '">' +
                '<div class="selected-desc">' + cloth.description + '</div>';

            document.getElementById(`section-${section}`).classList.add('has-selection');
        }

        // 选择衣服（保留用于编辑模式）
        function selectCloth(section, clothId) {
            const cloth = allClothes.find(c => c.id === clothId);
            if (!cloth) return;

            selections[section] = cloth;
            
            const displayDiv = document.getElementById(`selected-${section}`);
            displayDiv.innerHTML = 
                '<button class="btn-clear-selection" onclick="clearSelection(\'' + section + '\')">×</button>' +
                '<img src="' + cloth.image + '" class="selected-image" alt="' + cloth.description + '">' +
                '<div class="selected-desc">' + cloth.description + '</div>';

            document.getElementById(`section-${section}`).classList.add('has-selection');
        }

        // 清除选择
        function clearSelection(section) {
            selections[section] = null;
            
            const displayDiv = document.getElementById('selected-' + section);
            displayDiv.innerHTML = '<div class="empty-selection">点击下方选择衣服</div>';

            document.getElementById('section-' + section).classList.remove('has-selection');
        }

        // 保存搭配
        function saveOutfit() {
            const name = document.getElementById('outfitName').value.trim();
            
            if (!name) {
                alert('请给搭配起个名字！');
                return;
            }

            if (!selections.top && !selections.middle && !selections.bottom) {
                alert('请至少选择一件衣服！');
                return;
            }

            try {
                const outfits = JSON.parse(localStorage.getItem('outfits') || '[]');
                const outfitId = editOutfitId || Date.now().toString();
                
                const outfit = {
                    id: outfitId,
                    name: name,
                    top: selections.top ? selections.top.id : null,
                    middle: selections.middle ? selections.middle.id : null,
                    bottom: selections.bottom ? selections.bottom.id : null,
                    updateTime: new Date().toISOString()
                };

                if (editOutfitId) {
                    // 编辑模式：更新现有搭配
                    const index = outfits.findIndex(o => o.id === editOutfitId);
                    if (index !== -1) {
                        outfits[index] = { ...outfits[index], ...outfit };
                    }
                } else {
                    // 新建模式：添加新搭配
                    outfit.createTime = new Date().toISOString();
                    outfits.push(outfit);
                }

                localStorage.setItem('outfits', JSON.stringify(outfits));
                console.log('搭配保存成功');

                // 显示成功消息
                const successMsg = document.getElementById('successMessage');
                successMsg.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });

                setTimeout(function() {
                    successMsg.classList.remove('active');
                    if (editOutfitId) {
                        window.location.href = 'outfits.html';
                    } else {
                        resetAll();
                    }
                }, 2000);
            } catch (error) {
                console.error('保存搭配失败:', error);
                alert('保存失败: ' + error.message);
            }
        }

        // 重置所有
        function resetAll() {
            ['top', 'middle', 'bottom'].forEach(section => {
                clearSelection(section);
                sectionFilters[section] = { keyword: '', tags: new Set() };
            });
            
            document.getElementById('outfitName').value = '';
            
            document.querySelectorAll('.search-input').forEach(input => input.value = '');
            document.querySelectorAll('.tag-filter-btn').forEach(btn => btn.classList.remove('active'));
            
            ['top', 'middle', 'bottom'].forEach(section => displayClothes(section));
        }

        // 页面加载
        window.addEventListener('load', loadClothes);
    </script>
</body>
</html>
